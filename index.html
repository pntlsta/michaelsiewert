<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Signature Mike</title>
  <link rel="canonical" href="https://signaturemike.com/">
  <meta http-equiv="refresh" content="0; url=https://signaturemike.com/">
  <meta name="robots" content="noindex">
  <script>
    window.location.replace("https://signaturemike.com/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f1f6;
      color: #3a2c47;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    a { color: #6b4b8a; }
  </style>
</head>
<body>
  <p>
    This site has moved to
    <a href="https://signaturemike.com/">signaturemike.com</a>.
  </p>
</body>
</html>
